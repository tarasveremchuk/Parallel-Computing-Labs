server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: iot-monitoring-platform

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: IoTPlatformSuperSecretKeyThatIsAtLeast256BitsLong2026
    expiration-ms: 86400000

logging:
  level:
    com.iotplatform: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"