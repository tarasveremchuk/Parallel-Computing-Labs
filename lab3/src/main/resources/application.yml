server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: iot-monitoring-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/iot_platform?TimeZone=Europe/Kyiv
    username: iot_user
    password: iot_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: IoTPlatformSuperSecretKeyThatIsAtLeast256BitsLong2026
    expiration-ms: 86400000

logging:
  level:
    com.iotplatform: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"