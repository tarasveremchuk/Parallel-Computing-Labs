server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_auth_db?TimeZone=Europe/Kyiv
    username: iot_user
    password: iot_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: IoTPlatformSuperSecretKeyThatIsAtLeast256BitsLong2026
    expiration-ms: 86400000

services:
  device-service:
    url: http://localhost:8082/api
  telemetry-service:
    url: http://localhost:8083/api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.iotplatform: DEBUG